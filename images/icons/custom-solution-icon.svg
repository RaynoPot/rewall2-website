<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#E8F4F8" stroke="#4A90A4" stroke-width="2"/>
  
  <!-- Custom/hybrid wall - combination of materials -->
  <!-- Gear/cog symbol representing engineering -->
  <circle cx="50" cy="40" r="14" fill="none" stroke="#4A90A4" stroke-width="2"/>
  <circle cx="50" cy="40" r="5" fill="none" stroke="#4A90A4" stroke-width="1.5"/>
  <!-- Gear teeth -->
  <rect x="47" y="23" width="6" height="6" rx="1" fill="#4A90A4"/>
  <rect x="47" y="51" width="6" height="6" rx="1" fill="#4A90A4"/>
  <rect x="33" y="37" width="6" height="6" rx="1" fill="#4A90A4"/>
  <rect x="61" y="37" width="6" height="6" rx="1" fill="#4A90A4"/>
  <!-- Diagonal teeth -->
  <rect x="36" y="27" width="5" height="5" rx="1" fill="#4A90A4" transform="rotate(45 38.5 29.5)"/>
  <rect x="59" y="27" width="5" height="5" rx="1" fill="#4A90A4" transform="rotate(45 61.5 29.5)"/>
  <rect x="36" y="48" width="5" height="5" rx="1" fill="#4A90A4" transform="rotate(45 38.5 50.5)"/>
  <rect x="59" y="48" width="5" height="5" rx="1" fill="#4A90A4" transform="rotate(45 61.5 50.5)"/>
  
  <!-- Wrench accent -->
  <line x1="50" y1="58" x2="50" y2="72" stroke="#78909C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="72" r="4" fill="none" stroke="#78909C" stroke-width="2.5"/>
  
  <!-- Small sparkle accents -->
  <line x1="72" y1="25" x2="72" y2="31" stroke="#4A90A4" stroke-width="1.5" opacity="0.6"/>
  <line x1="69" y1="28" x2="75" y2="28" stroke="#4A90A4" stroke-width="1.5" opacity="0.6"/>
  <line x1="28" y1="60" x2="28" y2="65" stroke="#4A90A4" stroke-width="1" opacity="0.5"/>
  <line x1="25.5" y1="62.5" x2="30.5" y2="62.5" stroke="#4A90A4" stroke-width="1" opacity="0.5"/>
</svg>