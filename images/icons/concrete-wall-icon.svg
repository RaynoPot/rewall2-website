<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#E8F4F8" stroke="#4A90A4" stroke-width="2"/>
  
  <!-- Concrete wall - smooth L-shaped cantilever wall -->
  <!-- Vertical stem -->
  <rect x="30" y="25" width="10" height="50" fill="#B0BEC5" stroke="#78909C" stroke-width="1.5"/>
  <!-- Horizontal footing -->
  <rect x="22" y="70" width="40" height="8" fill="#B0BEC5" stroke="#78909C" stroke-width="1.5"/>
  
  <!-- Rebar dots (cross-section) -->
  <circle cx="33" cy="35" r="1.5" fill="#78909C"/>
  <circle cx="37" cy="35" r="1.5" fill="#78909C"/>
  <circle cx="33" cy="45" r="1.5" fill="#78909C"/>
  <circle cx="37" cy="45" r="1.5" fill="#78909C"/>
  <circle cx="33" cy="55" r="1.5" fill="#78909C"/>
  <circle cx="37" cy="55" r="1.5" fill="#78909C"/>
  <circle cx="33" cy="65" r="1.5" fill="#78909C"/>
  <circle cx="37" cy="65" r="1.5" fill="#78909C"/>
  
  <!-- Smooth surface finish lines -->
  <line x1="31" y1="30" x2="39" y2="30" stroke="#90A4AE" stroke-width="0.5" opacity="0.3"/>
  <line x1="31" y1="40" x2="39" y2="40" stroke="#90A4AE" stroke-width="0.5" opacity="0.3"/>
  <line x1="31" y1="50" x2="39" y2="50" stroke="#90A4AE" stroke-width="0.5" opacity="0.3"/>
  <line x1="31" y1="60" x2="39" y2="60" stroke="#90A4AE" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Soil behind wall -->
  <path d="M40 25 L75 25 L75 70 L62 70 L62 75 L40 75 Z" fill="#D2C4A8" opacity="0.25"/>
  
  <!-- Ground line -->
  <line x1="15" y1="78" x2="85" y2="78" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Grass accent -->
  <path d="M68 22 Q70 14 72 22" stroke="#66BB6A" stroke-width="1.5" fill="none"/>
  <path d="M71 24 Q74 17 76 25" stroke="#4CAF50" stroke-width="1.5" fill="none"/>
  <path d="M65 24 Q67 18 69 25" stroke="#66BB6A" stroke-width="1.5" fill="none"/>
</svg>