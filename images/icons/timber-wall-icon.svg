<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#E8F4F8" stroke="#4A90A4" stroke-width="2"/>
  
  <!-- Timber wall - horizontal timber poles stacked -->
  <!-- Bottom timber -->
  <rect x="25" y="65" width="45" height="8" rx="3" fill="#A0784C" stroke="#7A5A30" stroke-width="1.5"/>
  <!-- Second timber -->
  <rect x="27" y="55" width="43" height="8" rx="3" fill="#B8915E" stroke="#8B6D3F" stroke-width="1.5"/>
  <!-- Third timber -->
  <rect x="29" y="45" width="41" height="8" rx="3" fill="#A0784C" stroke="#7A5A30" stroke-width="1.5"/>
  <!-- Top timber -->
  <rect x="31" y="35" width="39" height="8" rx="3" fill="#B8915E" stroke="#8B6D3F" stroke-width="1.5"/>
  
  <!-- Wood grain lines -->
  <line x1="30" y1="69" x2="65" y2="69" stroke="#8B6D3F" stroke-width="0.5" opacity="0.4"/>
  <line x1="32" y1="59" x2="66" y2="59" stroke="#7A5A30" stroke-width="0.5" opacity="0.4"/>
  <line x1="34" y1="49" x2="66" y2="49" stroke="#8B6D3F" stroke-width="0.5" opacity="0.4"/>
  <line x1="36" y1="39" x2="66" y2="39" stroke="#7A5A30" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Vertical timber post (deadman) -->
  <rect x="25" y="32" width="5" height="44" rx="2" fill="#8B6D3F" stroke="#6B5030" stroke-width="1.5"/>
  
  <!-- Ground line -->
  <line x1="15" y1="75" x2="85" y2="75" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Grass/plant accent -->
  <path d="M72 32 Q74 24 76 32" stroke="#66BB6A" stroke-width="1.5" fill="none"/>
  <path d="M75 34 Q78 27 80 35" stroke="#4CAF50" stroke-width="1.5" fill="none"/>
  <path d="M18 60 Q20 54 22 61" stroke="#66BB6A" stroke-width="1.5" fill="none"/>
</svg>