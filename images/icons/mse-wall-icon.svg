<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#E8F4F8" stroke="#4A90A4" stroke-width="2"/>
  
  <!-- MSE Wall: Stacked concrete face panels with reinforcement strips -->
  
  <!-- Ground line -->
  <line x1="15" y1="78" x2="85" y2="78" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Reinforcement strips (geogrid) going back into soil -->
  <line x1="38" y1="72" x2="75" y2="72" stroke="#4A90A4" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="38" y1="60" x2="72" y2="60" stroke="#4A90A4" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="38" y1="48" x2="68" y2="48" stroke="#4A90A4" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  <line x1="38" y1="36" x2="62" y2="36" stroke="#4A90A4" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  
  <!-- Soil fill behind panels (subtle) -->
  <path d="M38 28 L58 28 L75 78 L38 78 Z" fill="#D2C4A8" opacity="0.25"/>
  
  <!-- Concrete face panels - stacked rectangles (the distinctive MSE look) -->
  <!-- Bottom row -->
  <rect x="20" y="66" width="18" height="12" rx="1" fill="#B0BEC5" stroke="#78909C" stroke-width="1.5"/>
  <!-- Second row (offset) -->
  <rect x="22" y="54" width="16" height="12" rx="1" fill="#B8C8D0" stroke="#78909C" stroke-width="1.5"/>
  <!-- Third row -->
  <rect x="24" y="42" width="14" height="12" rx="1" fill="#C0D0D8" stroke="#78909C" stroke-width="1.5"/>
  <!-- Top row -->
  <rect x="26" y="30" width="12" height="12" rx="1" fill="#C8D8E0" stroke="#78909C" stroke-width="1.5"/>
  
  <!-- Panel joint lines (horizontal) -->
  <line x1="20" y1="72" x2="38" y2="72" stroke="#607D8B" stroke-width="0.5" opacity="0.5"/>
  <line x1="22" y1="60" x2="38" y2="60" stroke="#607D8B" stroke-width="0.5" opacity="0.5"/>
  <line x1="24" y1="48" x2="38" y2="48" stroke="#607D8B" stroke-width="0.5" opacity="0.5"/>
  <line x1="26" y1="36" x2="38" y2="36" stroke="#607D8B" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Small connection dots where reinforcement meets panels -->
  <circle cx="38" cy="72" r="2" fill="#4A90A4"/>
  <circle cx="38" cy="60" r="2" fill="#4A90A4"/>
  <circle cx="38" cy="48" r="2" fill="#4A90A4"/>
  <circle cx="38" cy="36" r="2" fill="#4A90A4"/>
  
  <!-- Batter/lean indicator - subtle arrow showing the wall leans back -->
  <path d="M16 78 L28 28" stroke="#78909C" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
  
  <!-- Compacted fill texture dots -->
  <circle cx="50" cy="68" r="1" fill="#8B7355" opacity="0.3"/>
  <circle cx="55" cy="55" r="1" fill="#8B7355" opacity="0.3"/>
  <circle cx="48" cy="45" r="1" fill="#8B7355" opacity="0.3"/>
  <circle cx="60" cy="65" r="1" fill="#8B7355" opacity="0.3"/>
  <circle cx="52" cy="38" r="1" fill="#8B7355" opacity="0.3"/>
  <circle cx="65" cy="70" r="1" fill="#8B7355" opacity="0.3"/>
</svg>